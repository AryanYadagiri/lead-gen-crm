spring.application.name=lead-generation
server.port=${PORT:8080}
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.threads.virtual.enabled=true
my.custom.cron.expression=0 0 12 * * *
campaign.scheduler.cron=0 0 * * * *

# Hostinger SMTP Configuration
spring.mail.host=${SMTP_HOST:smtp.hostinger.com}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${HOSTINGER_EMAIL:}
spring.mail.password=${HOSTINGER_PASSWORD:}
spring.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lead_generation}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Apollo API Configuration
api.external-leads-database.base-url=${APOLLO_BASE_URL:https://api.apollo.io}
api.external-leads-database.base.key=${APOLLO_API_KEY:}
api.webhook-url.url=${WEBHOOK_URL:}

# MyEmailVerifier API Configuration
myemailverifier.api-key=${MYEMAILVERIFIER_API_KEY:}
myemailverifier.base-url=https://api.myemailverifier.com/api/validate_single.php
myemailverifier.enabled=true

# Email Relay Configuration (Bypasses cloud provider SMTP egress blocking)
email.relay.url=${EMAIL_RELAY_URL:https://lead-gen-crm-five.vercel.app/api/email}

# Cron Endpoint Security
cron.secret=${CRON_SECRET:miab-leadgen-cron-secret-2026}

# Local overrides (git-ignored and docker-ignored)
spring.config.import=optional:classpath:application.properties.local
