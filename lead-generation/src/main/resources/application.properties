spring.application.name=lead-generation
spring.jackson.property-naming-strategy=SNAKE_CASE
my.custom.cron.expression=0 0 12 * * *
campaign.scheduler.cron=0 0 * * * *
# Hostinger SMTP Configuration
spring.mail.host=smtp.hostinger.com
spring.mail.port=465
spring.mail.username=${HOSTINGER_EMAIL:your_email@domain.com}
spring.mail.password=${HOSTINGER_PASSWORD:your_hostinger_password}
spring.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.datasource.url=jdbc:postgresql://localhost:5432/lead_generation
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
api.external-leads-database.base-url=https://api.apollo.io
api.external-leads-database.base.key=${APOLLO_API_KEY:your_apollo_api_key}
api.webhook-url.url=${WEBHOOK_URL:https://webhook.site/your-webhook-id}

# MyEmailVerifier API Configuration
myemailverifier.api-key=${MYEMAILVERIFIER_API_KEY:your_myemailverifier_api_key}
myemailverifier.base-url=https://api.myemailverifier.com/api/validate_single.php
myemailverifier.enabled=true

